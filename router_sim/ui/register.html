<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetControl — Complete Registration</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1 class="title">Welcome</h1>
      <p class="subtitle">Set your password to complete registration</p>

      <form id="registerForm">
        <div class="form-group">
          <label for="password">New Password</label>
          <input type="password" id="password" name="password" required placeholder="Enter new password">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm new password">
        </div>
        <div class="form-group" style="display:flex; align-items:center; gap:10px;">
          <input type="checkbox" id="showPass" style="width:auto; margin-top:0;">
          <label for="showPass" style="margin-bottom:0; cursor:pointer; user-select:none;">Show Password</label>
        </div>
        <button type="submit" id="registerBtn">Set Password</button>
      </form>

      <div id="toast" class="toast hidden"></div>
      <p class="footer-text">&copy; 2025 NetControl</p>
    </div>
  </div>

  <script src="main.js"></script>
  <script src="register.js"></script>
</body>
</html>
