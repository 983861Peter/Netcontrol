<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetControl — Register Company</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1 class="title">Register Company</h1>
      <p class="subtitle">Create a new organization account</p>

      <form id="registerCompanyForm">
        <div class="form-group">
          <label for="companyName">Company Name</label>
          <input type="text" id="companyName" name="companyName" required placeholder="Acme Corp">
        </div>
        <div class="form-group">
          <label for="companyLocation">Company Location</label>
          <input type="text" id="companyLocation" name="companyLocation" required placeholder="e.g., New York, USA">
        </div>
        <div class="form-group">
          <label for="adminUsername">Admin Username (Alias)</label>
          <input type="text" id="adminUsername" name="adminUsername" required placeholder="jdoe">
        </div>
        <div class="form-group">
          <label for="adminEmail">Admin Email</label>
          <input type="email" id="adminEmail" name="adminEmail" required placeholder="admin@acme.com">
        </div>
        <div class="form-group">
          <label for="adminPhone">Phone Number</label>
          <input type="tel" id="adminPhone" name="adminPhone" placeholder="+1 555-123-4567">
        </div>
        <div class="form-group password-wrapper">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Password">
          <button type="button" class="password-toggle" data-target="password" aria-label="Show password" title="Show password">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <div class="form-group password-wrapper">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm Password">
          <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Show password" title="Show password">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <button type="submit" id="registerBtn">Register</button>
      </form>

      <div id="toast" class="toast hidden"></div>
      <p class="footer-text">Already have an account? <a href="login.html" style="color:#fff; text-decoration:underline;">Login</a></p>
    </div>
  </div>

  <script src="main.js"></script>
  <script src="register_company.js"></script>
</body>
</html>
