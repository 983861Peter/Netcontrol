<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NetControl — Clients</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><div class="logo">NetControl</div></div>
    <div class="top-actions">
      <button id="mobileNavToggle" class="icon-btn mobile-menu-btn" aria-label="Open menu">☰</button>
      <button class="icon-btn" onclick="location.href='index.html'">🏠</button>
      <button class="icon-btn" id="btnLogout3">⎋</button>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
  </div>

  <div class="app">
    <aside class="sidebar" id="appSidebar">
      <h4>Clients</h4>
      <a class="nav-link active" href="index.html">Overview</a>
      <a class="nav-link" href="stations.html">Stations & Sectors</a>
      <a class="nav-link" href="devices.html">Devices</a>
      <a class="nav-link" href="clients.html">Clients</a>
      <a class="nav-link" href="alerts.html">Alerts</a>
      <a class="nav-link" href="account.html">Account</a>
      <a class="nav-link" href="settings.html">Settings</a>
      <div style="margin-top:12px">
        <button class="btn" id="openAddClientModal">+ Add Client</button>
      </div>
    </aside>

    <main class="content">
      <div class="header-row">
        <h2>Client Management</h2>
        <div class="row">
          <input id="filterClient" class="input" placeholder="Search clients..." style="width:280px">
          <button class="btn ghost" id="btnRefreshClients">Refresh</button>
        </div>
      </div>

      <div class="card">
        <div class="title">Registered Clients</div>
        <table class="table" id="clientTable">
          <thead><tr><th>Name</th><th>Location</th><th>Contact</th><th>Devices</th><th>Actions</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </main>
  </div>
  
  <div id="modalRoot"></div>
  <div class="toasts" id="toasts"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
  const mobileToggle = document.getElementById("mobileNavToggle");
  const sidebar = document.getElementById("appSidebar");
  const overlay = document.getElementById("sidebarOverlay");

  const closeSidebar = () => {
    sidebar?.classList.remove("mobile-open");
    overlay?.classList.remove("visible");
  };

  mobileToggle?.addEventListener("click", () => {
    sidebar?.classList.toggle("mobile-open");
    overlay?.classList.toggle("visible");
  });

  overlay?.addEventListener("click", closeSidebar);
});
</script>
  <script src="main.js"></script>
  <script src="ui_utils.js"></script>
  <script src="clients.js"></script>
</body>
</html>
